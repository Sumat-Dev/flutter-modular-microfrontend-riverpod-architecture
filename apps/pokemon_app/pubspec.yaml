name: pokemon_app
description: "Root application shell. Owns bootstrap, theming, and go_router route composition."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  # Workspace libraries and feature microfrontends are resolved by name via
  # the pub workspace.
  core: any
  cupertino_icons: ^1.0.8
  feature_pokemon: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.1
  localization: any
  network: any
  storage: any
  ui_components: any

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # This project's Flutter SDK caps analyzer <8.0.0 (via flutter_test/test), so
  # go_router_builder is pinned to 4.1.1 (the newest build still allowing
  # analyzer 7.x). Newer builders require analyzer >=8.2.0.
  go_router_builder: 4.1.1

flutter:
  uses-material-design: true
