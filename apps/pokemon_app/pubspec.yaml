name: pokemon_app
description: "Root application shell. Owns bootstrap, theming, and flutter_modular route composition."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  # Workspace libraries and feature microfrontends are resolved by name via
  # the pub workspace.
  core: any
  cupertino_icons: ^1.0.8
  feature_berries: any
  feature_pokemon: any
  flutter:
    sdk: flutter
  flutter_modular: ^6.3.4
  flutter_riverpod: ^3.0.0
  localization: any
  material_ui: ^1.5.0
  network: any
  storage: any
  ui_components: any

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
