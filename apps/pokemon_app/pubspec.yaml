name: pokemon_app
description: "Root application shell. Owns bootstrap and top-level module composition only."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Routing / module composition
  flutter_modular: ^6.3.4

  # State management + DI
  flutter_riverpod: ^2.6.1

  # Workspace libraries (resolved by name via the pub workspace)
  library_core: any
  library_network: any
  library_storage: any
  library_ui_components: any

  # Feature microfrontends (resolved by name via the pub workspace)
  feature_pokemon: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
