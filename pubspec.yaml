name: pokemon_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

# Dart pub workspace (Dart >= 3.6). Every member package sets
# `resolution: workspace` and shares this single lockfile / .dart_tool.
workspace:
  - apps/pokemon_app
  - packages/libraries/core
  - packages/libraries/network
  - packages/libraries/storage
  - packages/libraries/ui_components
  - packages/libraries/localization
  - packages/features/pokemon

dev_dependencies:
  melos: ^6.3.2
  very_good_analysis: ^10.0.0
