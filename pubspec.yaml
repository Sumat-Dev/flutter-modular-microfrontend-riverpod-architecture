name: pokemon_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

workspace:
  - apps/pokemon_app
  - packages/libraries/core
  - packages/libraries/network
  - packages/libraries/ui_components
  - packages/libraries/localization
  - packages/features/pokemon
  - packages/features/berries
  - packages/features/items

dev_dependencies:
  melos: ^8.0.0
  very_good_analysis: ^10.0.0

melos:
  packages:
    - apps/**
    - packages/features/**
    - packages/libraries/**

  command:
    bootstrap:
      hooks:
        pre: flutter pub get

  scripts:
    setup:
      description: Run `flutter pub get` in every package that has a pubspec.yaml.
      run: dart run melos exec --file-exists=pubspec.yaml -- flutter pub get
    analyze:
      description: Run `flutter analyze` in all packages.
      run: dart run melos exec -c 1 -- flutter analyze
    format:
      description: Verify formatting across all packages.
      run: dart run melos exec -- dart format --output=none --set-exit-if-changed .
    format:fix:
      description: Apply Dart formatting across all packages.
      run: dart run melos exec -- dart format .
    test:
      description: Run tests in every package that has a test/ directory.
      run: dart run melos exec -c 1 --dir-exists=test -- flutter test
    test:coverage:
      description: Run tests with coverage in every testable package.
      run: dart run melos exec -c 1 --dir-exists=test -- flutter test --coverage
    test:junit:
      description: >
        Run tests with coverage and emit a JUnit XML report per package
        (junit.xml) for Codecov Test Analytics. Requires the `junitreport`
        package to be activated (`dart pub global activate junitreport`).
      run: >
        dart run melos exec -c 1 --dir-exists=test -- "flutter test --coverage
        --machine | tojunit --output junit.xml"
