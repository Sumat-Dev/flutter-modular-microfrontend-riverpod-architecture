name: pokemon_flutter_workspace
publish_to: none

environment:
  sdk: ^3.9.2

# Dart pub workspace (Dart >= 3.6). Every member package sets
# `resolution: workspace` and shares this single lockfile / .dart_tool.
workspace:
  - apps/pokemon_app
  - packages/libraries/library_core
  - packages/libraries/library_network
  - packages/libraries/library_storage
  - packages/libraries/library_ui_components
  - packages/features/pokemon

dev_dependencies:
  melos: ^6.3.2
