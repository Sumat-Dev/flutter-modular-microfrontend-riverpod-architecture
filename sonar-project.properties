sonar.projectKey=Sumat-Dev_flutter-modular-microfrontend-riverpod-architecture
sonar.organization=sumat-dev

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=flutter-modular-microfrontend-riverpod-architecture
#sonar.projectVersion=1.0

# --- Sources -----------------------------------------------------------------
# Only analyze production Dart code across the workspace packages. Tests are
# declared separately below so SonarQube treats them as test sources.
sonar.sources=\
  apps/pokemon_app/lib,\
  packages/libraries/core/lib,\
  packages/libraries/network/lib,\
  packages/libraries/ui_components/lib,\
  packages/libraries/localization/lib,\
  packages/features/pokemon/lib,\
  packages/features/berries/lib,\
  packages/features/items/lib

sonar.tests=\
  apps/pokemon_app/test,\
  packages/libraries/core/test,\
  packages/features/pokemon/test,\
  packages/features/berries/test,\
  packages/features/items/test

# Encoding of the source code. Default is default system encoding.
sonar.sourceEncoding=UTF-8

# --- Coverage ----------------------------------------------------------------
# Flutter emits one LCOV report per package at <package>/coverage/lcov.info.
# SonarQube's Dart analyzer imports them via sonar.dart.lcov.reportPaths.
sonar.dart.lcov.reportPaths=\
  apps/pokemon_app/coverage/lcov.info,\
  packages/libraries/core/coverage/lcov.info,\
  packages/features/pokemon/coverage/lcov.info,\
  packages/features/berries/coverage/lcov.info,\
  packages/features/items/coverage/lcov.info

# --- Exclusions --------------------------------------------------------------
# Exclude generated code and non-testable UI layers from coverage/analysis,
# mirroring codecov.yml.
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  **/l10n/**

sonar.coverage.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  **/presentation/**,\
  **/main.dart
