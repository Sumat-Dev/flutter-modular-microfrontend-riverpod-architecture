coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 1%
    patch:
      default:
        target: 75%
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "test/**"
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "lib/generated/**"
  - "**/presentation/**"
