name: feature_pokemon
description: "Golden reference feature (microfrontend). Pokemon list/detail with Clean Architecture + Riverpod."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  go_router: ^17.2.1
  flutter_riverpod: ^2.6.1

  equatable: ^2.0.7
  json_annotation: ^4.9.0

  core: any
  network: any
  storage: any
  ui_components: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  # NOTE: this project's Flutter SDK pins analyzer <8.0.0 (via flutter_test),
  # so json_serializable resolves to a 6.8.x build and json_annotation stays
  # <4.12.0. pub will select the highest compatible versions.

flutter:
  uses-material-design: true
