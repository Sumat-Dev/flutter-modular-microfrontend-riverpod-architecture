name: feature_pokemon
description: "Golden reference feature (microfrontend). Pokemon list/detail with Clean Architecture + Riverpod."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  flutter_modular: ^6.3.4
  flutter_riverpod: ^2.6.1

  equatable: ^2.0.7

  library_core:
    path: ../../libraries/library_core
  library_network:
    path: ../../libraries/library_network
  library_storage:
    path: ../../libraries/library_storage
  library_ui_components:
    path: ../../libraries/library_ui_components

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
