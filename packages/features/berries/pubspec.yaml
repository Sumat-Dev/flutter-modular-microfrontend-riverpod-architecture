name: feature_berries
description: "Berries feature (microfrontend). Berry list/detail with Clean Architecture + Riverpod."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  core: any
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_modular: ^6.3.4
  flutter_riverpod: ^3.0.0
  json_annotation: ^4.9.0
  material_ui: ^1.5.0
  network: any
  riverpod_annotation: ^3.0.0
  ui_components: any

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  riverpod_generator: ^3.0.0
  # NOTE: Riverpod 3.x (annotation + generator) is required here because the
  # workspace pulls in build 3.x via go_router_builder, and only the 3.x
  # riverpod_generator supports build 3.x. pub selects compatible builds.

flutter:
  uses-material-design: true
